[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pydantic-ai-extensions"
version = "0.1.0"
description = "Community extensions for Pydantic AI (context compression, etc.)"
requires-python = ">=3.13"
dependencies = [
    "pydantic-ai-slim>=2.26.0",
    "tiktoken>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "inline-snapshot",
    "pytest-recording",
    "ruff",
    "pyright",
    "dirty-equals",
    # Provider extras for capability guard tests (construct AnthropicModel/OpenAIResponsesModel)
    "pydantic-ai-slim[anthropic,openai]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pydantic_ai_extensions"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "Q", "RUF"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["src"]
exclude = ["tests"]
venvPath = "."
venv = "venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: marks tests that hit a live API (run with --live)"]

[tool.inline-snapshot]
create-command = "uv run pytest"
